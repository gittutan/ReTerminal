name: Android CI
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to build and publish to GitHub Releases'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-36" "ndk;29.0.13846066" "cmake;3.22.1"
          echo "$ANDROID_HOME/ndk/29.0.13846066/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Prepare signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          PROPERTIES_BASE64: ${{ secrets.PROP }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$PROPERTIES_BASE64" ]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/reterminal.keystore"
            printf '%s' "$PROPERTIES_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.properties"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set Commit Hash
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "COMMIT_HASH=$COMMIT_HASH" >> "$GITHUB_ENV"

      - name: Build with Gradle
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "app/reterminal-$COMMIT_HASH.apk"
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/reterminal.keystore
          SIGNING_PROPERTIES_FILE: ${{ runner.temp }}/signing.properties

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "app/reterminal-$COMMIT_HASH.apk" --clobber
          else
            gh release create "$RELEASE_TAG" "app/reterminal-$COMMIT_HASH.apk" \
              --title "$RELEASE_TAG" --generate-notes
          fi

      - name: Delete signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/reterminal.keystore" "$RUNNER_TEMP/signing.properties"
